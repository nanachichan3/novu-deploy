name: novu
services:
  redis:
    image: 'redis:alpine'
    container_name: novu_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
  api:
    image: 'ghcr.io/novuhq/novu/api:3.15.0'
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    container_name: novu_api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    environment:
      NODE_ENV: '${NODE_ENV}'
      API_ROOT_URL: '${API_ROOT_URL}'
      PORT: '3001'
      FRONT_BASE_URL: '${FRONT_BASE_URL}'
      MONGO_URL: 'mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin'
      MONGO_MIN_POOL_SIZE: '${MONGO_MIN_POOL_SIZE}'
      MONGO_MAX_POOL_SIZE: '${MONGO_MAX_POOL_SIZE}'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 'f81b200e0c8c35a4e9cd6639efbc93ac'
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: 'redis'
      REDIS_CACHE_SERVICE_PORT: '6379'
      S3_LOCAL_STACK: '${S3_LOCAL_STACK}'
      S3_BUCKET_NAME: '${S3_BUCKET_NAME}'
      S3_REGION: '${S3_REGION}'
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
      JWT_SECRET: '841887b064335d22a3b4c7fe15cd7716d2005a307c3d90cbc2e5a6aed3f551d3'
      STORE_ENCRYPTION_KEY: '8c1fcc30bdc4d7351702422cd3b70980798258d3066bb03cf1b739eae160a329'
      NOVU_SECRET_KEY: '239b2e26c6b94ab29aaf7754037d7e2a548939cf87eb035bb546fdc18f4ef333'
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: '${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME}'
      SENTRY_DSN: '${SENTRY_DSN}'
      NEW_RELIC_ENABLED: '${NEW_RELIC_ENABLED}'
      NEW_RELIC_APP_NAME: '${NEW_RELIC_APP_NAME}'
      NEW_RELIC_LICENSE_KEY: '${NEW_RELIC_LICENSE_KEY}'
            MONGO_AUTO_CREATE_INDEXES: 'true'
      IS_API_IDEMPOTENCY_ENABLED: '${IS_API_IDEMPOTENCY_ENABLED}'
      IS_API_RATE_LIMITING_ENABLED: '${IS_API_RATE_LIMITING_ENABLED}'
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: '${IS_NEW_MESSAGES_API_RESPONSE_ENABLED}'
      IS_V2_ENABLED: '${IS_V2_ENABLED}'
      IS_SELF_HOSTED: '${IS_SELF_HOSTED}'
    labels:
      - traefik.enable=true
      - traefik.http.routers.novu-api.rule=Host(`api.novu.qed.quest`)
      - traefik.http.services.novu-api.loadbalancer.server.port=3001
      - traefik.http.routers.novu-api.tls=true
      - traefik.http.routers.novu-api.tls.certresolver=letsencrypt
    networks:
      - coolify
    healthcheck:
      disable: true
  worker:
    image: 'ghcr.io/novuhq/novu/worker:3.15.0'
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    container_name: novu_worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    environment:
      NODE_ENV: '${NODE_ENV}'
      PORT: '3004'
      MONGO_URL: 'mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin'
      MONGO_MAX_POOL_SIZE: '${MONGO_MAX_POOL_SIZE}'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 'f81b200e0c8c35a4e9cd6639efbc93ac'
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: 'redis'
      REDIS_CACHE_SERVICE_PORT: '6379'
      S3_LOCAL_STACK: '${S3_LOCAL_STACK}'
      S3_BUCKET_NAME: '${S3_BUCKET_NAME}'
      S3_REGION: '${S3_REGION}'
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
      STORE_ENCRYPTION_KEY: '8c1fcc30bdc4d7351702422cd3b70980798258d3066bb03cf1b739eae160a329'
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: '${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME}'
      SENTRY_DSN: '${SENTRY_DSN}'
      NEW_RELIC_ENABLED: '${NEW_RELIC_ENABLED}'
      NEW_RELIC_APP_NAME: '${NEW_RELIC_APP_NAME}'
      NEW_RELIC_LICENSE_KEY: '${NEW_RELIC_LICENSE_KEY}'
      BROADCAST_QUEUE_CHUNK_SIZE: '${BROADCAST_QUEUE_CHUNK_SIZE}'
      MULTICAST_QUEUE_CHUNK_SIZE: '${MULTICAST_QUEUE_CHUNK_SIZE}'
      API_ROOT_URL: 'http://api:${API_PORT}'
      IS_EMAIL_INLINE_CSS_DISABLED: '${IS_EMAIL_INLINE_CSS_DISABLED}'
      IS_USE_MERGED_DIGEST_ID_ENABLED: '${IS_USE_MERGED_DIGEST_ID_ENABLED}'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -s --max-time 5 http://localhost:$${PORT:-3004}/ || exit 1'
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
  ws:
    image: 'ghcr.io/novuhq/novu/ws:3.15.0'
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    container_name: novu_ws
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    environment:
      PORT: '3004'
      NODE_ENV: '${NODE_ENV}'
      MONGO_URL: 'mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin'
      MONGO_MAX_POOL_SIZE: '${MONGO_MAX_POOL_SIZE}'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 'f81b200e0c8c35a4e9cd6639efbc93ac'
      JWT_SECRET: '841887b064335d22a3b4c7fe15cd7716d2005a307c3d90cbc2e5a6aed3f551d3'
      WS_CONTEXT_PATH: '${WS_CONTEXT_PATH:-/}'
      NEW_RELIC_ENABLED: '${NEW_RELIC_ENABLED}'
      NEW_RELIC_APP_NAME: '${NEW_RELIC_APP_NAME}'
      NEW_RELIC_LICENSE_KEY: '${NEW_RELIC_LICENSE_KEY}'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -s --max-time 5 http://localhost:$${PORT:-3004}/ || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  dashboard:
    image: 'ghcr.io/novuhq/novu/dashboard:3.15.0'
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    container_name: novu_dashboard
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    environment:
      VITE_API_HOSTNAME: '${VITE_API_HOSTNAME:-https://api.novu.qed.quest}'
      VITE_WEBSOCKET_HOSTNAME: '${VITE_WEBSOCKET_HOSTNAME:-wss://api.novu.qed.quest}'
    labels:
      - traefik.enable=true
      - traefik.http.routers.novu.rule=Host(`novu.qed.quest`)
      - traefik.http.services.novu.loadbalancer.server.port=4000
      - traefik.http.routers.novu.tls=true
      - traefik.http.routers.novu.tls.certresolver=letsencrypt
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"const http = require('http'); const req = http.get({hostname: 'localhost', port: 4000, path: '/', timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); });\""
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
  mongodb:
    image: 'mongo:8.0'
    container_name: novu_mongodb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: '${MONGO_PASSWORD}'
      MONGO_INITDB_DATABASE: novu-db
    volumes:
      - 'novu_mongodb_data:/data/db'
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify
volumes:
  novu_mongodb_data: null
networks:
  coolify:
    name: coolify
    external: true
