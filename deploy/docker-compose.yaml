name: novu
services:
  redis:
    image: 'redis:alpine'
    container_name: novu_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    healthcheck:
      test:
        - CMD
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
  api:
    depends_on:
      mongodb:
        condition: service_started
    environment:
      NODE_ENV: '${NODE_ENV}'
      API_ROOT_URL: '${API_ROOT_URL}'
      PORT: '3001'
      FRONT_BASE_URL: '${FRONT_BASE_URL}'
      MONGO_URL: 'mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin'
      MONGO_MIN_POOL_SIZE: '${MONGO_MIN_POOL_SIZE}'
      MONGO_MAX_POOL_SIZE: '${MONGO_MAX_POOL_SIZE}'
      REDIS_HOST: 'redis'
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 'f81b200e0c8c35a4e9cd6639efbc93ac'
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: 'redis'
      REDIS_CACHE_SERVICE_PORT: '6379'
      S3_LOCAL_STACK: '${S3_LOCAL_STACK}'
      S3_BUCKET_NAME: '${S3_BUCKET_NAME}'
      S3_REGION: '${S3_REGION}'
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
      JWT_SECRET: '841887b064335d22a3b4c7fe15cd7716d2005a307c3d90cbc2e5a6aed3f551d3'
      STORE_ENCRYPTION_KEY: '8c1fcc30bdc4d7351702422cd3b70980798258d3066bb03cf1b739eae160a329'
      NOVU_SECRET_KEY: '239b2e26c6b94ab29aaf7754037d7e2a548939cf87eb035bb546fdc18f4ef333'
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: '${SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME}'
      SENTRY_DSN: '${SENTRY_DSN}'
      NEW_RELIC_ENABLED: '${NEW_RELIC_ENABLED}'
      NEW_RELIC_APP_NAME: '${NEW_RELIC_APP_NAME}'
      NEW_RELIC_LICENSE_KEY: '${NEW_RELIC_LICENSE_KEY}'
            MONGO_AUTO_CREATE_INDEXES: 'true'
      IS_API_IDEMPOTENCY_ENABLED: '${IS_API_IDEMPOTENCY_ENABLED}'
      IS_API_RATE_LIMITING_ENABLED: '${IS_API_RATE_LIMITING_ENABLED}'
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: '${IS_NEW_MESSAGES_API_RESPONSE_ENABLED}'
      IS_V2_ENABLED: '${IS_V2_ENABLED}'
      IS_SELF_HOSTED: '${IS_SELF_HOSTED}'
    labels:
      -       -       -       -     networks:
      disable: true
  worker:
      BROADCAST_QUEUE_CHUNK_SIZE: '${BROADCAST_QUEUE_CHUNK_SIZE}'
      MULTICAST_QUEUE_CHUNK_SIZE: '${MULTICAST_QUEUE_CHUNK_SIZE}'
      IS_EMAIL_INLINE_CSS_DISABLED: '${IS_EMAIL_INLINE_CSS_DISABLED}'
      IS_USE_MERGED_DIGEST_ID_ENABLED: '${IS_USE_MERGED_DIGEST_ID_ENABLED}'
        - 'curl -s --max-time 5 http://localhost:$${PORT:-3004}/ || exit 1'
      start_period: 20s
  ws:
      WS_CONTEXT_PATH: '${WS_CONTEXT_PATH:-/}'
  dashboard:
      VITE_API_HOSTNAME: '${VITE_API_HOSTNAME:-https://api.novu.qed.quest}'
      VITE_WEBSOCKET_HOSTNAME: '${VITE_WEBSOCKET_HOSTNAME:-wss://api.novu.qed.quest}'
        - "node -e \"const http = require('http'); const req = http.get({hostname: 'localhost', port: 4000, path: '/', timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); });\""
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: '627939eeb1ad0f1f05c40dcfd1ff0199'
      MONGO_INITDB_DATABASE: novu-db
    volumes:
      - 'novu_mongodb_data:/data/db'
  novu_mongodb_data: null
  coolify:
    external: true
