name: novu
services:
  redis:
    image: redis:alpine
    container_name: novu_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  mongodb:
    image: mongo:7.0
    container_name: novu_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 627939eeb1ad0f1f05c40dcfd1ff0199
      MONGO_INITDB_DATABASE: novu-db
    volumes:
      - novu_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ping})' || mongo --eval 'db.adminCommand({ping})'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  api:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_ROOT_URL: https://api.novu.qed.quest
      FRONT_BASE_URL: https://novu.qed.quest
      MONGO_URL: mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin
      MONGO_AUTO_CREATE_INDEXES: "true"
      MONGO_MAX_POOL_SIZE: "100"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: f81b200e0c8c35a4e9cd6639efbc93ac
      REDIS_DB_INDEX: "2"
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      S3_LOCAL_STACK: "true"
      S3_BUCKET_NAME: novu
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: localstack
      AWS_SECRET_ACCESS_KEY: localstack
      STORE_ENCRYPTION_KEY: 8c1fcc30bdc4d7351702422cd3b70980798258d3066bb03cf1b739eae160a329
      JWT_SECRET: 841887b064335d22a3b4c7fe15cd7716d2005a307c3d90cbc2e5a6aed3f551d3
      NOVU_SECRET_KEY: 239b2e26c6b94ab29aaf7754037d7e2a548939cf87eb035bb546fdc18f4ef333
      API_CONTEXT_PATH: /api
      IS_SELF_HOSTED: "true"
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "true"
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "true"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
      BROADCAST_QUEUE_CHUNK_SIZE: "50"
      MULTICAST_QUEUE_CHUNK_SIZE: "50"
      NEW_RELIC_ENABLED: "false"
      SENTRY_DSN: ""
      NEW_RELIC_APP_NAME: ""
      NEW_RELIC_LICENSE_KEY: ""
    networks:
      - coolify
    ports:
      - "3001:3001"

  worker:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_worker
    restart: unless-stopped
    command: worker
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGO_URL: mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin
      MONGO_MAX_POOL_SIZE: "100"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: f81b200e0c8c35a4e9cd6639efbc93ac
      REDIS_DB_INDEX: "2"
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: "6379"
      JWT_SECRET: 841887b064335d22a3b4c7fe15cd7716d2005a307c3d90cbc2e5a6aed3f551d3
      IS_SELF_HOSTED: "true"
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "true"
      BROADCAST_QUEUE_CHUNK_SIZE: "50"
      MULTICAST_QUEUE_CHUNK_SIZE: "50"
      NEW_RELIC_ENABLED: "false"
      SENTRY_DSN: ""
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 5 http://localhost:3004/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  ws:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_ws
    restart: unless-stopped
    command: ws
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3004
      DB_INDEX: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: f81b200e0c8c35a4e9cd6639efbc93ac
      WS_CONTEXT_PATH: /
      NODE_ENV: production
      IS_SELF_HOSTED: "true"
    networks:
      - coolify

  web:
    image: ghcr.io/novuhq/apps/web:0.21.0
    container_name: novu_web
    restart: unless-stopped
    environment:
      API_HOSTNAME: https://api.novu.qed.quest
      WEBHOOK_URL: https://novu.qed.quest
      WIDGET_API_HOSTNAME: https://api.novu.qed.quest
    networks:
      - coolify
    ports:
      - "3002:3002"

  api-worker:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_api_worker
    restart: unless-stopped
    command: api-worker
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      MONGO_URL: mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: f81b200e0c8c35a4e9cd6639efbc93ac
      REDIS_DB_INDEX: "2"
      IS_SELF_HOSTED: "true"
      NEW_RELIC_ENABLED: "false"
    networks:
      - coolify

  ws-worker:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_ws_worker
    restart: unless-stopped
    command: ws-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DB_INDEX: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: f81b200e0c8c35a4e9cd6639efbc93ac
      NODE_ENV: production
      IS_SELF_HOSTED: "true"
    networks:
      - coolify

  elastic-mail:
    image: ghcr.io/novuhq/apps/api:0.21.0
    container_name: novu_elastic_mail
    restart: unless-stopped
    command: elastic-mail
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://root:627939eeb1ad0f1f05c40dcfd1ff0199@mongodb:27017/novu-db?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      IS_SELF_HOSTED: "true"
    networks:
      - coolify

volumes:
  novu_mongodb_data:

networks:
  coolify:
    external: true
